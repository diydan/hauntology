<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hauntology print parts viewer</title>
<style>
  * { box-sizing: border-box; }

  #tabs, #variants { display: flex; gap: 6px; padding: 10px 10px 8px; border-bottom: 1px solid #2c2638; }
  #variants { padding: 7px 10px; background: #16131e; align-items: center; }
  #variants .vlbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9b92ae; margin-right: 2px; }

  #variants button { padding: 5px 8px; font-size: 12.5px; }
  #tabs button.on { background: #d4a84b; color: #181209; border-color: #d4a84b; font-weight: 600; }
  #variants button.on { background: #5ce6b8; color: #0b1c16; border-color: #5ce6b8; font-weight: 600; }
  #variants button[data-var="old"].on { background: #9b92ae; color: #14111a; border-color: #9b92ae; }
  #list { overflow: auto; flex: 1; padding: 6px 0 12px; min-height: 0; }
  .grp { padding: 12px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9b92ae; }

  .tag.M { background: #d4604a; color: #fff; }
  .tag.E { background: #6bb6ff; color: #08121c; }
  .tag.S { background: #3a3350; color: #cfc7e0; }
  .tag.R { background: #e8dec8; color: #14111a; }
  .tag.H { background: #268bd2; color: #fff; font-size: 9px; letter-spacing: -0.3px; }
  .qty { font-size: 12px; color: #9b92ae; flex: none; }
  #legend { padding: 10px 12px; border-top: 1px solid #2c2638; font-size: 12px; color: #9b92ae; }
  #legend b { color: #e8dec8; font-weight: 600; }
  #legend .tag { display: inline-block; width: 18px; height: 18px; line-height: 18px; font-size: 10px; margin: 0 2px 0 6px; }
  #legend .k { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; white-space: nowrap; }
  #stage { flex: 1; position: relative; min-width: 0; background: radial-gradient(ellipse at 50% 40%, #a7a9b2 0%, #7c7e88 60%, #62646e 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: absolute; left: 14px; top: 12px; right: 14px; pointer-events: none; color: #14111a; text-shadow: 0 1px 0 #ffffff55; }
  #hud h1 { margin: 0 0 4px; font-size: 18px; }
  #hud .sub { font-size: 13px; }
  #hud .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #14111acc; color: #e8dec8; padding: 3px 9px; border-radius: 999px; font-size: 12px; text-shadow: none; }
  .chip.good { background: #0f2c23dd; color: #8af5cf; border: 1px solid #35745f; }
  .chip.warn { background: #332419dd; color: #f6c98e; border: 1px solid #755033; }
  #ctl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; background: #14111acc; }
  #ctl label { display: inline-flex; align-items: center; gap: 6px; }
  #ctl button { padding: 6px 12px; border: 1px solid #3a3350; background: #241f31; color: #e8dec8; border-radius: 8px; font: inherit; cursor: pointer; }
  #ctl input[type=range] { width: 140px; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #14111aee; z-index: 5; }
  #msg code { background: #2d2640; padding: 2px 6px; border-radius: 4px; }
  @media (max-width: 760px) {
    #app { flex-direction: column-reverse; }
    #side { width: 100%; height: 42%; border-right: 0; border-top: 1px solid #2c2638; }
    #stage { flex: 1; }
    #ctl > span { display: none; }
  }

<body>
<div id="app">
  <aside id="side">
    <div id="tabs"><button data-mode="parts" class="on">Parts</button><button data-mode="built">As built</button></div>
    <div id="variants" title="Compare the default lightweight hollowed redesign against the previous heavy solid parts">
      <span class="vlbl">Kit:</span>
      <button data-var="new" class="on">New · Light</button>
      <button data-var="old">Old · Heavy</button>
    </div>
    <div id="list"></div>
    <div id="legend"></div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="ctl">
      <label><input type="checkbox" id="cColour" checked> Print colours</label>
      <label><input type="checkbox" id="cBed" checked> 180 mm bed</label>
      <label id="lElec" style="display:none"><input type="checkbox" id="cElec" checked> Electronics</label>
      <label id="lEx" style="display:none">Explode <input type="range" id="cEx" min="0" max="1" step="0.01" value="0"></label>
      <button id="cReset">Reset view</button>
      <span style="color:#9b92ae">Drag to turn · wheel or pinch to zoom · shift-drag to move · arrow keys for next part · V toggles New/Old</span>
    </div>
    <div id="msg"></div>
  </main>
</div>

<script>

function hwBuilder() {

    let nx = uy*wz-uz*wy, ny = uz*wx-ux*wz, nz = ux*wy-uy*wx; const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    let arr = byCol.get(col); if (!arr) { arr = []; byCol.set(col, arr); }
    for (const p of [a, b, c]) arr.push(p[0], p[1], p[2], nx, ny, nz);

      const x0 = cx-sx/2, x1 = cx+sx/2, y0 = cy-sy/2, y1 = cy+sy/2, z0 = cz-sz/2, z1 = cz+sz/2;
      quad(col, [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]); quad(col, [x0,y1,z0],[x1,y1,z0],[x1,y0,z0],[x0,y0,z0]);
      quad(col, [x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]); quad(col, [x0,y1,z0],[x0,y0,z0],[x0,y0,z1],[x0,y1,z1]);
      quad(col, [x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]); quad(col, [x1,y1,z0],[x0,y1,z0],[x0,y1,z1],[x1,y1,z1]);

        const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);

const hwMeshCache = new Map();
function getHwModel(type, variantArg = 0) {

    b.box('#1e6fd9', 0, 0, 17.25, 32.5, 12.2, 2.5);        // Mounting flange ears
    b.cyl('#1e6fd9', -5.5, 0, 22.5, 4.0, 11.8, 11.8, 20);  // Output bearing boss
    b.cyl('#f2efe8', -5.5, 0, 26.5, 3.2, 4.8, 4.8, 14);    // White nylon spline

    b.box('#121418', 0, 1.0, 1.2, 34.6, 46.0, 2.4);        // Black LCD frame
    b.box('#225852', 0, 1.0, 2.45, 30.0, 39.0, 0.3);       // Illuminated eerie séance screen glass
    for (let i = 0; i < 8; i++) b.box('#e2b844', -8.89 + i * 2.54, -26.5, -4.5, 0.65, 0.65, 6.5);

      drawStrip(mkBand(cxw - 50, yBulk, 54.1, cxw + 22.5, yBulk, 54.1, 8.5, 5), [0.38, 0.96, 0.76, 0.95]);

    if (stage) {
      const cxs = stage.mesh.size[0] / 2, yCove = stage.mesh.size[1] - 34.6;

      const mkStageStrip = (zv) => {

        for (const dy of [-4.2, 0, 4.2]) a.push(cxs - 60, yCove + dy, zv, cxs + 60, yCove + dy, zv);

(function tick() { if (st.dirty) { st.dirty = false; try { draw(); } catch (e) { showMsg('Could not draw: ' + e.message); } } requestAnimationFrame(tick); })();

// ---------- input ----------
const ptrs = new Map(); let lastPinch = 0;

function pan(dx, dy) {

canvas.addEventListener('wheel', (e) => { e.preventDefault(); st.dist = Math.min(Math.max(st.dist * Math.exp(e.deltaY * 0.0012), 30), 3000); st.dirty = true; }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- side panel & HUD ----------
const listEl = $('#list');

function renderSide() {
  document.querySelectorAll('#variants button').forEach((b) => b.classList.toggle('on', b.dataset.var === st.variant));

    let g = '';

    }
  } else {
    h += '<div class="grp">Builds</div>';
    for (const a of ASSEMBLIES) {
      const dr = st.variant === 'new' && a.droppedInNew;
      const ttl = (st.variant === 'old' && a.oldTitle) ? a.oldTitle : a.title;
      h += `<div class="row${a.id === st.id ? ' on' : ''}" data-id="${a.id}"><span class="lbl${dr ? ' drop' : ''}">${esc(ttl)}${dr ? ' (dropped)' : ''}</span>${st.variant === 'new' && a.mergedInNew ? '<span class="lite-pill">3-in-1</span>' : ''}</div>`;
    }
    h += '<div class="grp">3D-printed parts in this build (tick to show)</div>';

      const dropped = isDroppedNow(p.file), lite = st.variant === 'new' && REDESIGNED.has(p.file);
      h += `<label class="row"><input type="checkbox" data-vis="${p.file}"${st.vis[p.file] !== false ? ' checked' : ''}><span class="dot" style="background:${SPOOLS[p.spool].hex}"></span><span class="lbl${dropped ? ' drop' : p.alt ? ' alt' : ''}">${esc(p.label)}${dropped ? ' (dropped)' : ''}</span>${lite ? '<span class="lite-pill">lite</span>' : ''}${n > 1 ? `<span class="qty">×${n}</span>` : ''}<span class="tag ${p.kind}" title="${KIND[p.kind]}">${p.kind}</span></label>`;

listEl.addEventListener('click', (e) => {

});
function renderHud() {

    const p = BY[st.id], m = st.items[0].mesh, s = SPOOLS[p.spool], dropped = isDroppedNow(p.file);

        weightChip = `<span class="chip warn">Dropped from default New kit (~${gCur}g saved · switch to Old or print optionally)</span>`;
      } else {
        weightChip = `<span class="chip">~${gCur}g PLA (${m.volCm3.toFixed(1)} cm³)</span>`;
      }

      <div class="chips"><span class="chip"><span class="dot" style="background:${s.hex}"></span>${s.name} ${s.hex}</span>${weightChip}<span class="chip"><span class="tag ${p.kind}">${p.kind}</span>${KIND[p.kind]}</span><span class="chip">${p.group}</span></div>`;

      const shortHw = { 'hw-esp32': 'ESP32', 'hw-sg90': 'SG90', 'hw-mts103': 'MTS-103', 'hw-btn16': '16mm btn', 'hw-ky040': 'KY-040', 'hw-rimsw': 'rim sw', 'hw-tft18': '1.8" TFT', 'hw-ws2812': 'WS2812B' };
