<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hauntology · Character Atelier</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0b0d10;
  --void:#050607;
  --wood:rgba(21,15,10,.9);
  --wood-2:rgba(33,23,15,.94);
  --wood-3:#2e2015;
  --line:#3d2d1f;
  --leather:#6b4d33;
  --ink:#e9e4d8;
  --muted:#b3aa97;
  --lantern:#e0a43a;
  --lantern-2:#f2bb55;
  --lantern-glow:rgba(224,164,58,.15);
  --ghost:#9fe8d0;
  --ghost-glow:rgba(159,232,208,.12);
  --alarm:#d4604a;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-ui:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 12.5px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stagebg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#090d11;isolation:isolate}
#stagebg .moonlayer{position:absolute;inset:-4%;pointer-events:none;transform:translate3d(var(--mx,0px),var(--my,0px),0) scale(var(--ms,1.02));will-change:transform}
#stagebg .moon{position:absolute;left:71%;top:23%;width:clamp(340px,38vw,600px);filter:brightness(1.25) contrast(1.08);height:auto;transform:translate(-50%,-50%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 68%);mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 68%);user-select:none}
#stagebg .skylayer{mix-blend-mode:screen;position:absolute;left:-4%;top:-4%;width:108%;height:108%;pointer-events:none;transform:translate3d(var(--sx,0px),var(--sy,0px),0);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 58%,transparent 78%);mask-image:linear-gradient(180deg,#000 0,#000 58%,transparent 78%)}
#stagebg .herobg{position:absolute;inset:-6%;opacity:.68;background:#061719 url(assets/bg/bg.webp) center/cover no-repeat;transform:translate3d(var(--bx,0px),var(--by,0px),0) scale(var(--bs,1.04));will-change:transform}
#stagebg .herobg video{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1.2s ease}
#stagebg .herobg.ready video{opacity:1}
#stagebg .hero-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(10,13,17,.80) 0%,rgba(10,13,17,.36) 40%,rgba(10,13,17,.14) 70%),linear-gradient(0deg,rgba(14,17,20,.90) 0%,rgba(14,17,20,.10) 44%,rgba(10,13,17,.35) 100%)}
body.thumbs #stagebg{display:none!important}
@media (prefers-reduced-motion:reduce){#stagebg .herobg{transform:scale(1.04)}#stagebg .moonlayer{transform:scale(1.02)}#stagebg .skylayer{transform:none}}
#view{position:absolute;inset:0;z-index:1}#view canvas{display:block;width:100%;height:100%;touch-action:none;transition:filter .35s ease}
button,select,input{touch-action:manipulation}
body.daguerreotype #view canvas{filter:grayscale(.95) sepia(.22) contrast(1.16) brightness(.94)}
body.daguerreotype #view::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 54% 44%,transparent 42%,rgba(5,6,7,.68) 100%)}

.hud{
  position:absolute;
  background:linear-gradient(180deg,var(--wood-2),var(--wood));
  border:1px solid var(--leather);
  outline:1px solid rgba(107,77,51,.28);
  outline-offset:-4px;
  border-radius:6px;
  box-shadow:0 18px 46px rgba(0,0,0,.72),0 0 28px rgba(224,164,58,.06);
  backdrop-filter:blur(10px);
}
#lookToggle:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{
  outline:2px solid var(--lantern);outline-offset:2px;box-shadow:0 0 0 4px var(--lantern-glow)
}

/* Header */
#title{
  top:14px;left:16px;width:368px;padding:11px 14px 10px;z-index:4;
  background:
    repeating-linear-gradient(90deg,rgba(233,228,216,.024) 0 1px,transparent 1px 18px),
    linear-gradient(180deg,var(--wood-2),var(--wood));
}
#title .th{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#title h1{
  margin:0;
  font:400 22px/1.1 var(--font-display);
  font-style:italic;
  letter-spacing:.01em;
  color:var(--ink);
  text-shadow:0 2px 14px rgba(224,164,58,.18);
}
#title .crest{
  font:500 9.5px/1 var(--font-ui);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--lantern);border:1px solid var(--leather);
  padding:3px 6px;border-radius:3px;background:rgba(224,164,58,.08);
  white-space:nowrap;
}
#title p{margin:4px 0 0;color:var(--muted);font:400 10.5px/1.3 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}

/* Left Atelier Drawer */
#look{
  top:90px;left:16px;width:368px;max-height:calc(100% - 166px);
  display:flex;flex-direction:column;padding:0;overflow:hidden;z-index:4;
  transition:opacity .25s ease;
}
#look.busy,#bar.busy,#stageUtils.busy{opacity:.48;pointer-events:none}
#lookTop{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px 7px;border-bottom:1px solid var(--line);
  background:rgba(5,6,7,.35);
}
#lookToggle{
  all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;
  flex:1;cursor:pointer;font:500 10.5px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
#lookToggle i{width:7px;height:7px;border-right:1.5px solid var(--lantern);border-bottom:1.5px solid var(--lantern);transform:rotate(45deg);margin:-3px 2px 0 0;transition:transform .2s}
#look.closed #lookToggle i{transform:rotate(-45deg);margin:0 2px 0 0}
#look.closed #lookTabs,#look.closed .lbody{display:none}
#look.closed #lookTop{border-bottom:0}

/* Creator Sub-tabs */
#lookTabs{
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
  padding:7px 9px;border-bottom:1px solid var(--line);
  background:rgba(11,13,16,.55);flex:0 0 auto;
}
#lookTabs button{
  background:transparent;border:1px solid transparent;border-radius:4px;
  color:var(--muted);padding:6px 2px;cursor:pointer;
  font:500 10.5px/1.1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;
  transition:border-color .15s,color .15s,background .15s;
}
#lookTabs button:hover{color:var(--ink);border-color:var(--line);background:rgba(46,32,21,.55)}
#lookTabs button[aria-selected=true]{
  color:var(--lantern-2);border-color:var(--lantern);background:var(--lantern-glow);
  box-shadow:inset 0 -1px 0 var(--lantern);
}

.lbody{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 12px 14px;
  scrollbar-width:thin;scrollbar-color:var(--leather) transparent;
}
.lbody::-webkit-scrollbar{width:6px}
.lbody::-webkit-scrollbar-thumb{background:var(--leather);border-radius:3px}
.tabpane[hidden]{display:none!important}

/* Sections & Form Controls */
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;margin-top:2px;padding-top:0}
.sec>h3{
  margin:0 0 7px;display:flex;align-items:center;justify-content:space-between;
  font:400 14.5px/1.15 var(--font-display);font-style:italic;letter-spacing:.01em;color:var(--lantern-2);
}
.subh{
  margin:11px 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--line);
  display:flex;align-items:center;justify-content:space-between;
  font:500 10px/1.2 var(--font-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--ash,var(--muted));
}
.row{display:flex;align-items:center;gap:7px;margin-top:7px}
.row>label{flex:0 0 78px;font:500 10px/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.seg button,.btn{
  background:rgba(46,32,21,.55);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:5px 9px;font:500 11px/1.15 var(--font-ui);cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;
}
.seg button:hover,.btn:hover{border-color:var(--leather);background:var(--wood-3)}
.seg button[aria-pressed=true],.btn[aria-pressed=true]{
  border-color:var(--lantern);background:var(--lantern-glow);color:var(--lantern-2);
}
.btn.mini{padding:3px 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.btn.danger{border-color:rgba(212,96,74,.45);color:#f3a899}
.btn.danger:hover{border-color:var(--alarm);background:rgba(212,96,74,.14)}
.sel{
  flex:1;min-width:0;background:rgba(11,13,16,.7);border:1px solid var(--line);
  color:var(--ink);border-radius:4px;padding:5px 8px;font:400 11.5px var(--font-ui);cursor:pointer;
}
.sel option{background:#150f0a;color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-ui);color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--lantern);margin:0;cursor:pointer}
.edit{flex:0 0 auto;height:25px;padding:0 8px;display:grid;place-items:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

/* Cast Gallery & Manor Archetype Cards */
.cast-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.cast-card{
  display:flex;align-items:center;gap:7px;padding:5px 6px;text-align:left;
  background:rgba(11,13,16,.55);border:1px solid var(--line);border-radius:5px;
  color:var(--ink);cursor:pointer;min-width:0;transition:border-color .15s,background .15s;
}
.cast-card:hover{border-color:var(--leather);background:rgba(46,32,21,.6)}
.cast-card[aria-pressed=true]{
  border-color:var(--ghost);background:var(--ghost-glow);
  box-shadow:0 0 14px rgba(159,232,208,.12);
}
.cast-scroll{max-height:242px;overflow-y:auto;margin-top:6px;padding-right:3px;scrollbar-width:thin;scrollbar-color:var(--leather) transparent}
.cast-scroll::-webkit-scrollbar{width:5px}.cast-scroll::-webkit-scrollbar-thumb{background:var(--leather);border-radius:3px}
.cast-scroll .cast-grid{margin-top:0}
.cast-card img{
  width:32px;height:32px;border-radius:4px;object-fit:cover;flex:0 0 auto;
  border:1px solid var(--line);background:#050607;
}
.cast-card .cm{min-width:0;display:flex;flex-direction:column;gap:1px}
.cast-card b{font:500 11.5px/1.15 var(--font-display);color:var(--ink);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-card span{font:400 9px/1.2 var(--font-ui);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-card.bw img{filter:grayscale(1) contrast(1.15)}
.cast-bar{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}

.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.arch-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;text-align:left;
  background:
    repeating-linear-gradient(135deg,rgba(233,228,216,.025) 0 1px,transparent 1px 10px),
    rgba(21,15,10,.72);
  border:1px solid var(--line);border-radius:5px;color:var(--ink);cursor:pointer;
  transition:border-color .15s,background .15s;
}
.arch-btn:hover{border-color:var(--lantern);background:var(--wood-3)}
.arch-btn[aria-pressed=true]{border-color:var(--lantern);background:var(--lantern-glow)}
.arch-btn b{font:400 13.5px/1.1 var(--font-display);font-style:italic;color:var(--lantern-2)}
.arch-btn span{font:400 9.5px/1.2 var(--font-ui);color:var(--muted)}

details.adv{
  margin-top:10px;border:1px solid var(--line);border-radius:5px;
  background:rgba(5,6,7,.35);padding:6px 8px;
}
details.adv>summary{
  cursor:pointer;font:500 10.5px/1.2 var(--font-ui);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);user-select:none;
}
details.adv[open]>summary{color:var(--lantern-2);margin-bottom:4px}

/* Picture Strips */
.pick{margin-top:9px}.ph{display:flex;align-items:baseline;gap:8px}
.ph>label{font:500 10px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ph>em{flex:1;min-width:0;font:400 13px var(--font-display);font-style:italic;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .edit{margin-left:auto}
.sw-wrap{position:relative;margin-top:4px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;padding:3px 2px 4px;scroll-padding:0 30px;cursor:grab}
.strip::-webkit-scrollbar{display:none}.strip.drag{cursor:grabbing;scroll-snap-type:none}
.tile{
  flex:0 0 68px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:0 0 4px;background:rgba(11,13,16,.65);border:1px solid var(--line);border-radius:5px;
  color:var(--muted);cursor:pointer;overflow:hidden;font:500 9.5px/1.1 var(--font-ui);
}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:rgba(21,15,10,.6);-webkit-user-drag:none;user-select:none}
.tile span{max-width:100%;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.noimg{justify-content:center;min-height:76px}
.tile i.none{display:block;width:100%;aspect-ratio:1;background:repeating-linear-gradient(135deg,rgba(233,228,216,.04) 0 6px,rgba(233,228,216,.09) 6px 7px);position:relative}
.tile i.none::after{content:"";position:absolute;inset:30%;border:1.5px solid var(--muted);border-radius:50%;background:linear-gradient(135deg,transparent 46%,var(--muted) 46% 54%,transparent 54%)}
.tile[aria-pressed=true]{border-color:var(--lantern);color:var(--lantern-2);box-shadow:0 0 0 1px var(--lantern),0 0 12px var(--lantern-glow)}
.tile:hover{border-color:var(--leather)}
.nav{
  position:absolute;top:50%;transform:translateY(-62%);width:24px;height:24px;border-radius:50%;
  background:rgba(21,15,10,.95);border:1px solid var(--leather);color:var(--ink);
  font:500 14px/1 var(--font-ui);padding:0 0 2px;display:grid;place-items:center;cursor:pointer;z-index:2;
}
.nav.l{left:-4px}.nav.r{right:-4px}.nav[hidden]{display:none}

/* Colours & Sliders */
.row.has-pal{flex-wrap:wrap}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.swatches.pal-wide{flex:1 0 100%;margin:4px 0 2px;gap:5px}
.swdot{width:18px;height:18px;border-radius:50%;border:1px solid var(--leather);cursor:pointer;padding:0}
.swdot:hover{transform:scale(1.12);border-color:var(--lantern)}
.chip{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);padding:0;cursor:pointer;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.chip[aria-pressed=true]{border-color:var(--lantern-2);box-shadow:0 0 0 2px var(--lantern)}
.hex{font:400 11px var(--font-ui);color:var(--muted)}
.cols{margin:4px 0 0;display:flex;flex-direction:column}.cols[hidden]{display:none}.cols .row>label{flex-basis:64px}
.wheel{margin:7px 0 2px;padding:9px;display:flex;gap:10px;align-items:center;background:rgba(11,13,16,.75);border:1px solid var(--leather);border-radius:6px}
.wheel canvas{width:146px;height:146px;flex:0 0 auto;touch-action:none;cursor:crosshair}
.wheel .wc{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.wheel input[type=text]{width:100%;min-width:0;background:rgba(21,15,10,.8);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 6px;font:400 11.5px var(--font-ui)}
.wheel .prev{height:24px;border-radius:4px;border:1px solid var(--line)}
.rng{display:flex;align-items:center;gap:7px;margin-top:6px}
.rng>label{flex:0 0 92px;font:400 10px/1.2 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rng input{flex:1;min-width:0;accent-color:var(--lantern)}
.rng .cap{flex:0 0 54px;text-align:right;font:500 10.5px var(--font-ui);color:var(--ink);white-space:nowrap}

/* Top-Right Stage Utilities */
#stageUtils{
  top:14px;right:16px;padding:7px 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:4;
}
#stageUtils .sep{width:1px;height:18px;background:var(--line)}
#plateBtn[aria-pressed=true]{border-color:var(--ghost);background:var(--ghost-glow);color:var(--ghost)}

/* Bottom Transport Bar */
#bar{
  left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;
  padding:8px 12px;max-width:calc(100% - 24px);z-index:4;
}
@media (min-width:981px){
  #look:not(.closed) ~ #bar{left:calc(50% + 192px);max-width:calc(100% - 412px)}
}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{font:500 10px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#rnd{border-color:rgba(224,164,58,.6);background:rgba(224,164,58,.14);color:var(--lantern-2)}
#rnd:hover{border-color:var(--lantern-2);background:rgba(224,164,58,.24)}

/* Loading & Status */
#boot{left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;text-align:center;pointer-events:none;min-width:250px;margin-top:140px;z-index:5}
#boot b{display:block;font:400 15px var(--font-display);font-style:italic;color:var(--ink)}
#boot span{display:block;margin-top:2px;font:400 10.5px var(--font-ui);color:var(--muted)}
#boot i{display:block;height:3px;margin-top:9px;border-radius:2px;background:rgba(233,228,216,.1);overflow:hidden}
#boot u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lantern),var(--ghost));transition:width .25s}
#stat{bottom:66px;right:16px;padding:6px 10px;font:400 10.5px var(--font-ui);color:var(--muted);white-space:pre;max-width:320px;overflow:hidden;text-overflow:ellipsis;z-index:4}
body.thumbs .hud{display:none!important}

@media (max-width:980px){
  #stageUtils{top:14px;right:12px;padding:6px 8px;gap:6px}
  #title{width:min(352px,calc(100% - 370px));min-width:210px}
}
@media (max-width:760px){
  #stat,#title p,#title .crest,#stageUtils .grp>span,#stageUtils .sep,#copyJsonBtn{display:none}
  #title{
    top:max(8px,env(safe-area-inset-top));left:8px;width:auto;min-width:0;max-width:calc(100% - 224px);
    padding:7px 10px;
  }
  #title h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stageUtils{
    top:max(8px,env(safe-area-inset-top));right:8px;bottom:auto;
    padding:5px 7px;gap:4px;z-index:6;flex-wrap:nowrap;
  }
  #stageUtils .seg{gap:3px;flex-wrap:nowrap}
  #stageUtils button{padding:5px 6px;font-size:10px;min-height:28px}
  #look.closed{
    top:auto;bottom:calc(124px + env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%);
    width:auto;max-width:calc(100% - 24px);max-height:none;border-radius:999px;outline-offset:-3px;
    box-shadow:0 10px 26px rgba(0,0,0,.78);z-index:5;
  }
  #look.closed #lookTop{padding:7px 14px;background:rgba(15,11,8,.72)}
  #look.closed #lookToggle{gap:10px;font-size:10px;letter-spacing:.12em}
  #look.closed #lookToggle i{transform:rotate(-135deg);margin:3px 0 0}
  #look:not(.closed){
    top:auto;bottom:0;left:0;right:0;width:100%;max-width:none;
    height:min(48dvh,430px);max-height:48dvh;
    border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;outline-offset:-4px;
    padding-bottom:env(safe-area-inset-bottom);z-index:5;
  }
  #look:not(.closed) #lookTop{padding:9px 14px 8px}
  #look:not(.closed) #lookToggle i{transform:rotate(45deg);margin:-3px 2px 0 0}
  #look:not(.closed)~#bar{display:none}
  #lookTabs{padding:6px 8px;gap:4px}
  #lookTabs button{min-height:34px;font-size:10px;letter-spacing:.04em;padding:5px 2px}
  .lbody{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:9px 12px calc(14px + env(safe-area-inset-bottom))}
  .cast-scroll{max-height:192px;-webkit-overflow-scrolling:touch}
  .cast-card{padding:6px 7px;min-height:44px}
  .tile{flex-basis:64px}
  .btn.mini{min-height:30px;padding:4px 9px}
  .swdot{width:22px;height:22px}
  .swatches.pal-wide{gap:6px}
  .rng input{height:24px}
  .wheel{flex-wrap:wrap}
  #bar{

async function randomLook(seed = null, fullScope = $('rndAll').checked, syncScene = true) {
  const useSeed = (seed != null && Number.isFinite(+seed)) ? ((+seed) >>> 0) : ((Math.random() * 1e6) | 0);
  applySeededState(useSeed, fullScope);
  if (presetSel) presetSel.value = '';
  wheel.close();
  if (fullScope) {
    lastSeed = useSeed;
    history.replaceState(null, '', '#seed=' + useSeed);
    statusNote = `Summoned soul · #${useSeed}`;
  } else {
    statusNote = `Rolled features · #${useSeed}`;
  }
  syncSlidersUI(); syncCastUI();
  if (!syncScene) return useSeed;
  applyShape();
  applySculptMorphs();
  if (fullScope) {
    await applyLook(true);
    status(statusNote);
  } else {
    refreshUI();
    status(statusNote);

  return useSeed;
}
