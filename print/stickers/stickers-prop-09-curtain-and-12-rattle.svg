<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="105mm" viewBox="0 0 180 105">
  <title>Hauntology 1:1 Sticker Sheet — Prop #9 (Curtain Reveal) &amp; Prop #12 (Rattle Prop)</title>
  <style>
    text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .cut { fill: none; stroke: #e0a43a; stroke-width: 0.25; stroke-dasharray: 1.5 1; }
    .lbl { fill: #b3aa97; font-size: 3px; }
  </style>
  <rect width="180" height="105" fill="#0b0d10"/>
  <text x="8" y="8" fill="#e9e4d8" font-size="4.2" font-weight="bold">PROP #9 (CURTAIN) &amp; PROP #12 (RATTLE) · 1:1 STICKERS (MM)</text>
  <rect x="8" y="11" width="50" height="1" fill="#e0a43a"/>
  <text x="61" y="12" class="lbl">50.0 mm scale check</text>

  <!-- Prop #9: "THE SOLUTION" Valance Nameplate (65.6 x 11.6 mm for 66 x 12 mm pocket) -->
  <g transform="translate(10, 18)">
    <rect width="65.6" height="11.6" rx="1.1" fill="#150f0a" stroke="#e0a43a" stroke-width="0.7"/>
    <text x="32.8" y="7.4" text-anchor="middle" fill="#e0a43a" font-size="4.6" letter-spacing="1.4" font-weight="bold">THE SOLUTION</text>
    <rect x="-0.2" y="-0.2" width="66.0" height="12.0" rx="1.2" class="cut"/>
    <text x="32.8" y="16" text-anchor="middle" class="lbl">Prop #9 Valance Nameplate (66 x 12 mm)</text>
  </g>

  <!-- Prop #9: Gold Trim Strip for Scalloped Valance (156 x 6 mm) -->
  <g transform="translate(10, 38)">
    <rect width="156" height="6" rx="0.8" fill="#e0a43a"/>
    <line x1="2" y1="3" x2="154" y2="3" stroke="#6a4a14" stroke-width="0.5" stroke-dasharray="3 1.5"/>
    <rect x="-0.2" y="-0.2" width="156.4" height="6.4" rx="1.0" class="cut"/>
    <text x="78" y="10.5" text-anchor="middle" class="lbl">Prop #9 Gold Valance Trim Strip (156 x 6 mm)</text>
  </g>

  <!-- Prop #12: Three Bats Eye Stickers (6x 2.6 mm red discs + spares) -->
  <g transform="translate(10, 56)">
    <text x="0" y="4" class="lbl">Prop #12 Bat Eyes (2.6 mm):</text>
    <g transform="translate(8, 12)">
      <circle cx="0" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="0" cy="0" r="1.5" class="cut"/>
      <circle cx="5" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="5" cy="0" r="1.5" class="cut"/>
      <circle cx="12" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="12" cy="0" r="1.5" class="cut"/>
      <circle cx="17" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="17" cy="0" r="1.5" class="cut"/>
      <circle cx="24" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="24" cy="0" r="1.5" class="cut"/>
      <circle cx="29" cy="0" r="1.3" fill="#ff6b6b"/><circle cx="29" cy="0" r="1.5" class="cut"/>
    </g>
  </g>

  <!-- Prop #12: Five Chandelier Flame Stickers (5.2 x 9.0 mm teardrops) -->
  <g transform="translate(65, 56)">
    <text x="0" y="4" class="lbl">Prop #12 Chandelier Flames (5x):</text>
    <g id="flame" transform="translate(6, 15)">
      <path d="M 0,-5 C 2.5,-1 2.6,3 0,4.5 C -2.6,3 -2.5,-1 0,-5 Z" fill="#ffd86b" stroke="#e0a43a" stroke-width="0.3"/>
      <ellipse cx="0" cy="1.5" rx="1.1" ry="2.0" fill="#fff2d2"/>
      <ellipse cx="0" cy="0" rx="2.8" ry="5.0" class="cut"/>
    </g>
    <use href="#flame" x="10"/><use href="#flame" x="20"/><use href="#flame" x="30"/><use href="#flame" x="40"/>
  </g>

  <!-- Prop #12: Victorian Doll Face Sticker (15.8 mm dia for 16.2 mm pocket) -->
  <g transform="translate(145, 70)">
    <circle r="7.9" fill="#e9e4d8" stroke="#6b4d33" stroke-width="0.4"/>
    <path d="M -7.8,-1.5 C -6,-8 6,-8 7.8,-1.5 C 4,-4.5 -4,-4.5 -7.8,-1.5 Z" fill="#21170f"/>
    <circle cx="-2.8" cy="-0.5" r="1.2" fill="#0b0d10"/>
    <circle cx="2.8" cy="-0.5" r="1.2" fill="#0b0d10"/>
    <path d="M -2.2,3.5 Q 0,1.8 2.2,3.5" fill="none" stroke="#d4604a" stroke-width="0.6"/>
    <circle r="8.1" class="cut"/>
    <text x="0" y="12.5" text-anchor="middle" class="lbl">Doll Face (16 mm)</text>
  </g>
</svg>
