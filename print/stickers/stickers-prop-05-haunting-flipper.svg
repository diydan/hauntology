<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="175mm" viewBox="0 0 210 175">
  <title>Hauntology 1:1 Sticker Sheet — Prop #5: Haunting Flipper (6 Portraits, 6 Ghosts, 6 Seat Discs)</title>
  <style>
    text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .cut { fill: none; stroke: #e0a43a; stroke-width: 0.25; stroke-dasharray: 1.5 1; }
    .lbl { fill: #b3aa97; font-size: 2.8px; }
  </style>
  <rect width="210" height="175" fill="#0b0d10"/>
  <text x="8" y="8" fill="#e9e4d8" font-size="4.2" font-weight="bold">PROP #5 · HAUNTING FLIPPER · 6 SEAT PORTRAITS, 6 GHOSTS &amp; 6 SEAT DISCS (1:1 MM)</text>
  <rect x="8" y="11" width="50" height="1" fill="#e0a43a"/>
  <text x="61" y="12" class="lbl">50.0 mm scale check</text>

  <!-- Row 1: Six Flap Front Seat Portraits (31.6 x 51.6 mm for 32 x 52 mm pocket) -->
  <!-- Seat 1 Red (#ff6b6b), Seat 2 Blue (#6bb6ff), Seat 3 Green (#6be39a), Seat 4 Yellow (#ffd86b), Seat 5 Violet (#c49bff), Seat 6 Orange (#ffb27a) -->
  <g transform="translate(8, 17)">
    <g transform="translate(0, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#ff6b6b" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#ff6b6b"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#ff6b6b"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 1</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <g transform="translate(33.2, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#6bb6ff" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#6bb6ff"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#6bb6ff"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 2</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <g transform="translate(66.4, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#6be39a" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#6be39a"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#6be39a"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 3</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <g transform="translate(99.6, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#ffd86b" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#ffd86b"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#ffd86b"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 4</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <g transform="translate(132.8, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#c49bff" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#c49bff"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#c49bff"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 5</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <g transform="translate(166.0, 0)">
      <rect width="31.6" height="51.6" rx="2.8" fill="#150f0a" stroke="#ffb27a" stroke-width="0.8"/>
      <circle cx="15.8" cy="18" r="7.5" fill="#ffb27a"/><path d="M 6,42 Q 15.8,22 25.6,42 Z" fill="#ffb27a"/>
      <text x="15.8" y="48" text-anchor="middle" fill="#e9e4d8" font-size="3.4" font-weight="bold">SEAT 6</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
  </g>

  <!-- Row 2: Six Flap Back Ghost Stickers (31.6 x 51.6 mm, "JOINED THE HAUNTING") -->
  <g transform="translate(8, 74)">
    <g id="ghostCard">
      <rect width="31.6" height="51.6" rx="2.8" fill="#050607" stroke="#9fe8d0" stroke-width="0.7"/>
      <path d="M 5.8,38 V 20 a 10,10 0 0,1 20,0 V 38 q -2.5,-3 -5,0 q -2.5,3 -5,0 q -2.5,-3 -5,0 q -2.5,3 -5,0 Z" fill="#e9e4d8"/>
      <ellipse cx="12.5" cy="19" rx="1.5" ry="2.4" fill="#050607"/><ellipse cx="19.1" cy="19" rx="1.5" ry="2.4" fill="#050607"/>
      <ellipse cx="15.8" cy="25" rx="2.0" ry="2.8" fill="#050607"/>
      <text x="15.8" y="46.5" text-anchor="middle" fill="#9fe8d0" font-size="2.5">HAUNTING</text>
      <rect x="-0.2" y="-0.2" width="32.0" height="52.0" rx="3.0" class="cut"/>
    </g>
    <use href="#ghostCard" x="33.2"/>
    <use href="#ghostCard" x="66.4"/>
    <use href="#ghostCard" x="99.6"/>
    <use href="#ghostCard" x="132.8"/>
    <use href="#ghostCard" x="166.0"/>
  </g>

  <!-- Row 3: Six Plinth Seat Colour Discs (17.8 mm dia for 18.2 mm pocket) -->
  <g transform="translate(8, 134)">
    <g transform="translate(15.8, 12)"><circle r="8.9" fill="#ff6b6b"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">1</text><circle r="9.1" class="cut"/></g>
    <g transform="translate(49.0, 12)"><circle r="8.9" fill="#6bb6ff"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">2</text><circle r="9.1" class="cut"/></g>
    <g transform="translate(82.2, 12)"><circle r="8.9" fill="#6be39a"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">3</text><circle r="9.1" class="cut"/></g>
    <g transform="translate(115.4, 12)"><circle r="8.9" fill="#ffd86b"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">4</text><circle r="9.1" class="cut"/></g>
    <g transform="translate(148.6, 12)"><circle r="8.9" fill="#c49bff"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">5</text><circle r="9.1" class="cut"/></g>
    <g transform="translate(181.8, 12)"><circle r="8.9" fill="#ffb27a"/><text y="1.2" text-anchor="middle" fill="#0b0d10" font-size="4.2" font-weight="bold">6</text><circle r="9.1" class="cut"/></g>
    <text x="98" y="30" text-anchor="middle" class="lbl">Six Plinth Seat Colour Discs (18 mm dia: red, blue, green, yellow, violet, orange)</text>
  </g>
</svg>
