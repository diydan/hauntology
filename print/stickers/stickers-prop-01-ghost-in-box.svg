<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="110mm" viewBox="0 0 180 110">
  <title>Hauntology 1:1 Sticker Sheet — Prop #1: Ghost in the Box</title>
  <style>
    text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .cut { fill: none; stroke: #e0a43a; stroke-width: 0.25; stroke-dasharray: 1.5 1; }
    .lbl { fill: #b3aa97; font-size: 3px; }
  </style>
  <rect width="180" height="110" fill="#0b0d10"/>
  <text x="8" y="8" fill="#e9e4d8" font-size="4.2" font-weight="bold">PROP #1 · GHOST IN THE BOX · 1:1 STICKERS (MM)</text>
  <rect x="8" y="11" width="50" height="1" fill="#e0a43a"/>
  <text x="61" y="12" class="lbl">50.0 mm scale check</text>

  <!-- 1. Brass Latch Plate (32 x 20 mm) -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="32" height="20" rx="1.6" fill="#e0a43a" stroke="#6a4a14" stroke-width="0.6"/>
    <rect x="1.2" y="1.2" width="29.6" height="17.6" rx="1.0" fill="none" stroke="#21170f" stroke-width="0.35"/>
    <circle cx="3.5" cy="3.5" r="1.0" fill="#21170f"/><circle cx="28.5" cy="3.5" r="1.0" fill="#21170f"/>
    <circle cx="3.5" cy="16.5" r="1.0" fill="#21170f"/><circle cx="28.5" cy="16.5" r="1.0" fill="#21170f"/>
    <circle cx="16" cy="8.2" r="2.6" fill="#0b0d10"/>
    <polygon points="14.4,8.5 17.6,8.5 18.4,15.5 13.6,15.5" fill="#0b0d10"/>
    <rect x="-0.2" y="-0.2" width="32.4" height="20.4" rx="1.7" class="cut"/>
    <text x="16" y="24.5" text-anchor="middle" class="lbl">Brass Latch (32 x 20 mm)</text>
  </g>

  <!-- 2. Ghost Eyes (2x 10 x 16 mm ovals) & Mouth (14 x 20 mm oval) -->
  <g transform="translate(56, 20)">
    <ellipse cx="6" cy="9" rx="5.0" ry="8.0" fill="#0b0d10"/>
    <ellipse cx="4.5" cy="6.5" rx="1.2" ry="1.8" fill="#e9e4d8" opacity="0.6"/>
    <ellipse cx="6" cy="9" rx="5.2" ry="8.2" class="cut"/>

    <ellipse cx="22" cy="9" rx="5.0" ry="8.0" fill="#0b0d10"/>
    <ellipse cx="20.5" cy="6.5" rx="1.2" ry="1.8" fill="#e9e4d8" opacity="0.6"/>
    <ellipse cx="22" cy="9" rx="5.2" ry="8.2" class="cut"/>

    <ellipse cx="42" cy="11" rx="7.0" ry="10.0" fill="#0b0d10"/>
    <ellipse cx="42" cy="11" rx="7.2" ry="10.2" class="cut"/>
    <text x="24" y="26" text-anchor="middle" class="lbl">Ghost Eyes (10x16 mm) &amp; Mouth (14x20 mm)</text>
  </g>

  <!-- 3. Optional Wood Plank Accent Strips (144 x 12 mm x 3) -->
  <g transform="translate(10, 52)">
    <rect x="0" y="0" width="144" height="12" rx="1" fill="#21170f" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="4" y1="4" x2="140" y2="4" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="12" y1="8" x2="132" y2="8" stroke="#3d2d1f" stroke-width="0.4"/>
    <rect x="-0.2" y="-0.2" width="144.4" height="12.4" rx="1.2" class="cut"/>

    <rect x="0" y="16" width="144" height="12" rx="1" fill="#21170f" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="8" y1="20" x2="136" y2="20" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="4" y1="24" x2="140" y2="24" stroke="#3d2d1f" stroke-width="0.4"/>
    <rect x="-0.2" y="15.8" width="144.4" height="12.4" rx="1.2" class="cut"/>

    <rect x="0" y="32" width="144" height="12" rx="1" fill="#21170f" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="6" y1="36" x2="138" y2="36" stroke="#3d2d1f" stroke-width="0.4"/>
    <line x1="14" y1="40" x2="130" y2="40" stroke="#3d2d1f" stroke-width="0.4"/>
    <rect x="-0.2" y="31.8" width="144.4" height="12.4" rx="1.2" class="cut"/>
    <text x="72" y="49" text-anchor="middle" class="lbl">Chest Plank Grain Strips (144 x 12 mm)</text>
  </g>
</svg>
